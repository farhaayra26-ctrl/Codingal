<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>digital zoo manager</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>My Wildlife Park</h1>

  <p>
    Explore the animal areas and learn about parent, child,
    sibling, and node types using JavaScript and the DOM.
  </p>

  <div id="zoo">

    <div class="zone" id="tigerZone">
      <h2>Tiger Area</h2>
      <p>Animal: <span class="animal">Tiger</span></p>
    </div>

    <div class="zone" id="giraffeZone">
      <h2>Giraffe Area</h2>
      <p>Animal: <span class="animal">Giraffe</span></p>
    </div>

    <div class="zone" id="monkeyZone">
      <h2>Monkey Area</h2>
      <p>Animal: <span class="animal">Monkey</span></p>
    </div>

  </div>

  <button onclick="managePark()">Explore Park</button>

  <div id="output">
    Park information will appear here.
  </div>







<script src="script.js"></script>
</body>
</html>

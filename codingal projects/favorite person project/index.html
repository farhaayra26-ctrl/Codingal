<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Favourite Person</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <style>
    body { background-color: #F4F1F8; }
    h1   { color: #8E5BA6; }
    .card-label { font-size: 11px; color: #999; text-transform: uppercase; }
    pre  { font-size: 13px; color: #333; }
  </style>
</head>
<body class="py-4">

  <div class="container">

    <h1 class="mb-1">Favourite Person Profile</h1>
    <p class="text-muted mb-4">
      Learning JavaScript Objects
    </p>

    <div class="card shadow-sm mb-3" style="max-width:400px;">
      <div class="card-body">
        <h5 class="card-title" style="color:#8E5BA6;">Person Details</h5>

        <ul class="list-group list-group-flush">

          <li class="list-group-item">
            <span class="card-label d-block">Name</span>
            <strong id="name">-</strong>
          </li>

          <li class="list-group-item">
            <span class="card-label d-block">Relationship</span>
            <strong id="relationship">-</strong>
          </li>

          <li class="list-group-item">
            <span class="card-label d-block">Favourite Activity</span>
            <strong id="activity">-</strong>
          </li>

          <li class="list-group-item">
            <span class="card-label d-block">City</span>
            <strong id="city">-</strong>
          </li>

        </ul>
      </div>
    </div>

    <div class="card shadow-sm" style="max-width:400px;">
      <div class="card-body">
        <h6 style="color:#8E5BA6;">JavaScript Object</h6>
        <pre id="codeDisplay"
          class="bg-light p-3 rounded border mb-0"></pre>
      </div>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>

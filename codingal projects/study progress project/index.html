<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>My Learning Tracker</title>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
 <div class="jumbotron jumbotron-fluid">
    <div class="container">
      <h1>My Learning Tracker</h1>
      <p class="lead">Keep track of your subjects, lessons, and overall study progress.</p>

    <button class="btn btn-info">Biology</button>
      <button class="btn btn-secondary">Physics</button>
      <button class="btn btn-success">Chemistry</button>
      <button class="btn btn-dark">ICT</button>
    </div>
  </div>

 <div class="container">

    <!-- TOPIC 3: BADGES -->
    <h2 class="section-title">Lessons Finished <span class="badge badge-primary">26</span></h2>

    <p>Biology <span class="badge badge-info">7 lessons</span></p>
    <p>Physics <span class="badge badge-secondary">6 lessons</span></p>
    <p>Chemistry <span class="badge badge-success">8 lessons</span></p>
    <p>ICT <span class="badge badge-dark">5 lessons</span></p>

    <!-- TOPIC 4: PROGRESS BARS -->
    <h2 class="section-title">My Subject Progress</h2>

    <p>Biology</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-info" style="width: 75%">75%</div>
    </div>

    <p>Physics</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-secondary" style="width: 60%">60%</div>
    </div>

    <p>Chemistry</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-success" style="width: 85%">85%</div>
    </div>

    <p>ICT</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-dark" style="width: 65%">65%</div>
    </div>

  </div>

































    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  </body>
  </html>

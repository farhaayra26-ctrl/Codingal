<DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>birthday card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="birthday-card">

    <div class="emoji">Birthday Time</div>

    <h1>My Birthday Countdown Checker</h1>

    <p>
      Click the button to check how many days are left for the birthday celebration.
    </p>

    <button onclick="checkBirthday()">Check Birthday Countdown</button>

    <h2>Days Left</h2>
    <div id="daysBox">?</div>

    <div class="info-box">
      <h2>Birthday Result</h2>
      <p id="result"></p>
    </div>

    <div class="info-box">
      <h2>Countdown Review</h2>
      <p id="countdown"></p>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>

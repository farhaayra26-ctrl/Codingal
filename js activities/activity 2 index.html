<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Basics</h2>

<p>A <b>JavaScript program</b> contains
<b>statements</b> that tell the computer what to do.</p>

<p id="demo"></p>

<script>
var a, b, total; // Statement 1
a = 8; // Statement 2
b = 7; // Statement 3
total = a + b; // Statement 4

document.getElementById("demo").innerHTML =
"The total value is " + total + ".";

</script>

</body>
</html>

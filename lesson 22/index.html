<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>my phone contact app</title>
    <link
      href=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css "
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="py-4">
    <div class="container">
      <h1 class="mb-1">my contact app</h1>
      <p class="text-muted mb-4">learning js</p>
      <!--heading is done by now, lets make a contact contact card-->
      <div class="card shadow-sm mb-3">
        <div class="c_body">
          <h3 class="title">contact book</h3>
          <ul class="list-group list-group-flush">
            <li class="list-group-item">
              <span class="card-label d-block"> name </span>
              <b id="name">-</b>
            </li>
            <li class="list-group-item">
              <span class="card-label d-block">Location</span>
              <b id="city">-</b>
            </li><li class="list-group-item">
              <span class="card-label d-block">Company</span>
              <b id="company">-</b><li class="list-group-item">
              <span class="card-label d-block"> phone number </span>
              <b id="phone">-</b>
            </li>
            </li>
          </ul>
        </div>
      </div>
      <div class="card-shadow-sm"></div>
      <div class="card-body">
        <h3>object that can be used in script file</h3>
        <pre id="showObj" class="bg-light p-3 rounded border"></pre>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
  <html></html>
</html>

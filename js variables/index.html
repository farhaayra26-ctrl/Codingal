<!DOCTYPE html>
<html>
<head>
  <title>Js Variables</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">


<h1>Working With Numbers</h1>
<p>Adding Two Values</p>
<p id="result"></p>

<script>
    var firstNumber = 8;
    var secondNumber = 7;
    var total = firstNumber + secondNumber;

    document.getElementById("result").innerHTML =
    "The answer is: " + total;

</script>

</body>
</html>
